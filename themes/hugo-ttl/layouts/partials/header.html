<!DOCTYPE html>
<html lang="{{ .Site.Language }}">
  <head>
    <title>{{ if not .IsHome }}{{ .Title | title }} | {{ end }}{{ .Site.Title }}</title>
    <link rel="canonical" href="{{ .Site.BaseURL }}">
    <link rel='alternate' type='application/rss+xml' title="{{ .Site.Title }} RSS" href='/index.xml'>
    <link rel='stylesheet' type='text/css' href='/style.css?v={{ now.Unix }}'>
    {{ with .Site.Params.favicon }}<link rel="icon" href="{{ . }}">
    {{ end -}}
    <meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Summary }}{{ end }}">
    {{ if isset .Params "tags" }}<meta name="keywords" content="{{ with .Params.tags }}{{ delimit . ", " }}{{ end }}">
    {{ end -}}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <meta charset="utf-8">
  </head>
  <body class="kind-{{ .Kind }} section-{{ .Section }}">
    <div class="site-shell">
    <div class="site-topbar">
      <a class="brand" href="{{ .Site.BaseURL }}">Estelle Chauveau<span>.</span></a>
      <div class="topbar-links">
        <a href="/docs/CV.pdf">CV</a>
        <a href="https://github.com/echauvea">GitHub</a>
        <a href="https://www.linkedin.com/in/estelle-chauveau/">LinkedIn</a>
      </div>
    </div>
    {{ if not .IsHome }}
      <div class="breadcrumb">
        <a href="{{ .Site.BaseURL }}">← Home</a>
      {{ if not .IsSection }}
        <span>/</span>
        <a href="{{ .Site.BaseURL }}{{.Section}}">Back to {{ .CurrentSection.Title }}</a>
      {{ end }}
      </div>
    {{ end }}
    {{- if .Site.Menus.main }}
    {{ partial "nav.html" . }}
    {{ end }}
    <main class="site-main">
